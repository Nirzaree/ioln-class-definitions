<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Satellite Mosaic Viewer</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f4f9; text-align: center; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        select { padding: 10px; margin: 10px; border-radius: 5px; border: 1px solid #ddd; width: 200px; }
        .image-card { margin-top: 20px; border: 2px solid #eee; padding: 10px; border-radius: 8px; }
        img { max-width: 100%; height: auto; border-radius: 4px; display: block; margin: auto; }
        .filename { color: #666; font-size: 0.9em; margin-top: 10px; font-family: monospace; }
    </style>
</head>
<body>

<div class="container">
    <h2>Geospatial Mosaic Explorer</h2>
    
    <label>Location:</label>
    <select id="location" onchange="updateDisplay()">
        <option value="mosaic_of_use_116_deccan_peninsula_deccan_south">Deccan South (116)</option>
    </select>

    <label>Imagery Type:</label>
    <select id="type" onchange="updateDisplay()">
        <option value="rgb.png">True Color (RGB)</option>
        <option value="fcc543.png">FCC 543</option>
        <option value="fcc564.png">FCC 564</option>
        <option value="fcc654.png">FCC 654</option>
        <option value="fcc654Dry.png">FCC 654 (Dry)</option>
        <option value="basemap.jpg">Google Basemap</option>
    </select>

    <div class="image-card">
        <img id="viewer" src="data/mosaic_of_use_116_deccan_peninsula_deccan_south_rgb.png" alt="Satellite Data">
        <div id="fileLabel" class="filename">Loading...</div>
    </div>
</div>

<script>
    function updateDisplay() {
        const location = document.getElementById('location').value;
        const type = document.getElementById('type').value;
        const imgPath = `data/${location}_${type}`;
        
        document.getElementById('viewer').src = imgPath;
        document.getElementById('fileLabel').innerText = `Current File: ${location}_${type}`;
    }
    
    // Initialize label on load
    window.onload = updateDisplay;
</script>

</body>
</html>
